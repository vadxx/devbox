name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # first run only: make the ghcr package public (repo → Packages → devbox)
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          # version = highest-priority tag, always a single line
          # (meta.outputs.tags can be multiline, which would break docker run)
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
        run: |
          ssh-keygen -t ed25519 -N '' -f k
          docker run -d --name smoke -v "$PWD/k.pub:/run/devbox_authorized_key:ro" "$IMAGE"
          for i in $(seq 1 10); do docker exec smoke pgrep -x sshd && exit 0; sleep 1; done
          docker logs smoke
          exit 1
